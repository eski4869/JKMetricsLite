<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
    }

    #panel {
      display: inline-block;
      padding: 12px;
      background: rgba(0, 0, 0, 0.75);
    }

    canvas {
      display: block;
      width: 740px;
      height: 360px;
    }

  </style>
</head>
<body>
<div id="panel">
  <canvas id="chart" width="740" height="360"></canvas>
</div>

<script>
const screenMetricsFilePath = "../raw_data/attempts/current/screen_metrics.tsv";
const areaFilePath = "../raw_data/attempts/current/area_progress.tsv";
const screenEventsFilePath = "../raw_data/attempts/current/screen_events.tsv";
const stateFilePath = "../raw_data/attempts/current/current_state.tsv";

const maxPoints = 1500;
let cachedAreaLayoutSignature = "";
let cachedScreenEventsText = "";
let cachedScreenToProgress = new Map();
let cachedAreaRanges = [];
let cachedMaxProgress = 0;
let cachedPoints = [];
let lastAttempt = "";
let lastScreenOrderRevision = null;
let lastPointKey = "";
let hasFullRebuild = false;

function resetGraphCache() {
  cachedAreaLayoutSignature = "";
  cachedScreenEventsText = "";
  cachedScreenToProgress = new Map();
  cachedAreaRanges = [];
  cachedMaxProgress = 0;
  cachedPoints = [];
  lastPointKey = "";
}

async function fetchText(path) {
  const res = await fetch(path + "?t=" + Date.now());
  return await res.text();
}

function parseTsv(text) {
  const lines = text.trim().split(/\r?\n/);

  if (lines.length <= 1) {
    return [];
  }

  const header = lines[0].split("\t");

  return lines.slice(1).filter(line => line.trim() !== "").map(line => {
    const cols = line.split("\t");
    const row = {};

    header.forEach((key, index) => {
      row[key] = cols[index] || "";
    });

    return row;
  });
}

function getRecentLines(text, maxLines) {
  let end = text.length;

  while (end > 0) {
    const code = text.charCodeAt(end - 1);

    if (code === 10 || code === 13) {
      end--;
    } else {
      break;
    }
  }

  let start = end;
  let lines = 0;

  while (start > 0 && lines < maxLines) {
    start = text.lastIndexOf("\n", start - 1);

    if (start < 0) {
      start = 0;
      break;
    }

    lines++;
  }

  if (start > 0) {
    start++;
  }

  return text.slice(start, end).split(/\r?\n/).filter(line => line !== "");
}

function buildAreaLayoutSignature(areaRows) {
  return areaRows
    .filter(row => {
      const areaName = row.area_name || "";
      return areaName !== "" && areaName !== "Unknown";
    })
    .map(row => {
      const areaName = row.area_name || "";
      const isExcluded = row.excluded === "1" ? "1" : "0";
      return areaName + "\t" + isExcluded;
    })
    .join("\n");
}

async function loadScreenMetrics() {
  await loadScreenToProgressMap();
  const text = await fetchText(screenMetricsFilePath);
  const recentLines = getRecentLines(text, maxPoints);

  const points = recentLines.map(line => {
    const cols = line.split("\t");

    if (cols.length < 2) {
      return null;
    }

    const elapsedMs = Number(cols[0]);
    const screen = Number(cols[1]);
    const progress = cachedScreenToProgress.get(screen);

    if (!progress) {
      return null;
    }

    return buildGraphPoint(elapsedMs, screen, progress);
  }).filter(p =>
    p &&
    Number.isFinite(p.elapsedMs) &&
    Number.isFinite(p.progressIndex)
  );

  cachedPoints = points;
  return cachedPoints;
}

function buildGraphPoint(elapsedMs, screen, progress) {
  return {
    elapsedMs,
    screen,
    progressIndex: progress.progressIndex,
    areaIndex: progress.areaIndex,
    screenInArea: progress.screenInArea,
    label: progress.areaIndex + "-" + progress.screenInArea
  };
}

function remapCachedPoints() {
  cachedPoints = cachedPoints.map(point => {
    const progress = cachedScreenToProgress.get(point.screen);

    if (!progress) {
      return null;
    }

    return buildGraphPoint(point.elapsedMs, point.screen, progress);
  }).filter(point => point !== null);

  if (cachedPoints.length > maxPoints) {
    cachedPoints = cachedPoints.slice(-maxPoints);
  }

  return cachedPoints.length;
}

async function loadCurrentState() {
  const text = await fetchText(stateFilePath);
  const row = parseTsv(text)[0] || {};

  return {
    attempt: row.attempt || "",
    elapsedMs: Number(row.elapsed_ms),
    screen: Number(row.screen),
    areaName: row.area_name || "",
    currentAreaOrder: Number(row.current_area_order),
    currentScreenOrder: Number(row.current_screen_order),
    screenOrderRevision: Number(row.screen_order_revision) || 0
  };
}

async function loadScreenToProgressMap() {
  const areaText = await fetchText(areaFilePath);
  const screenEventsText = await fetchText(screenEventsFilePath);

  const areaRows = parseTsv(areaText);
  const areaLayoutSignature = buildAreaLayoutSignature(areaRows);

  if (
    areaLayoutSignature === cachedAreaLayoutSignature &&
    screenEventsText === cachedScreenEventsText
  ) {
    return cachedScreenToProgress;
  }

  const screenEventRows = parseTsv(screenEventsText);
  const includedAreas = [];
  const includedAreaSet = new Set();

  areaRows.forEach(row => {
    const areaName = row.area_name || "";

    if (areaName === "" || areaName === "Unknown" || row.excluded === "1") {
      return;
    }

    if (!includedAreaSet.has(areaName)) {
      includedAreaSet.add(areaName);
      includedAreas.push(areaName);
    }
  });

  const screensByArea = new Map();

  screenEventRows.forEach(row => {
    const areaName = row.area_name || "";
    const eventName = row.event || "";
    const screen = Number(row.screen);

    if (eventName !== "landing" ||
        !includedAreaSet.has(areaName) ||
        !Number.isFinite(screen)) {
      return;
    }

    if (!screensByArea.has(areaName)) {
      screensByArea.set(areaName, []);
    }

    const screens = screensByArea.get(areaName);

    if (!screens.includes(screen)) {
      screens.push(screen);
    }
  });

  const screenToProgress = new Map();
  const areaRanges = [];
  let progressIndex = 1;

  includedAreas.forEach((areaName, areaIndex) => {
    const screens = screensByArea.get(areaName) || [];
    const startProgressIndex = progressIndex;

    screens.forEach((screen, screenIndex) => {
      if (!screenToProgress.has(screen)) {
        screenToProgress.set(screen, {
          progressIndex,
          areaIndex: areaIndex + 1,
          screenInArea: screenIndex + 1
        });

        progressIndex++;
      }
    });

    if (progressIndex > startProgressIndex) {
      areaRanges.push({
        areaIndex: areaIndex + 1,
        start: startProgressIndex,
        end: progressIndex - 1
      });
    }
  });

  cachedAreaLayoutSignature = areaLayoutSignature;
  cachedScreenEventsText = screenEventsText;
  cachedScreenToProgress = screenToProgress;
  cachedAreaRanges = areaRanges;
  cachedMaxProgress = Math.max(0, progressIndex - 1);

  return cachedScreenToProgress;
}

function getPointKey(state) {
  return state.attempt + "|" +
    state.screenOrderRevision + "|" +
    state.elapsedMs + "|" +
    state.screen;
}

function appendStatePoint(state) {
  if (!Number.isFinite(state.elapsedMs) ||
      !Number.isFinite(state.screen) ||
      state.screen <= 0) {
    return "invalid-state";
  }

  const key = getPointKey(state);

  if (key === lastPointKey) {
    return "same-point";
  }

  let progress = cachedScreenToProgress.get(state.screen);
  let result = "known-screen";

  if (!progress) {
    if (!Number.isFinite(state.currentAreaOrder) ||
        !Number.isFinite(state.currentScreenOrder) ||
        state.currentAreaOrder <= 0 ||
        state.currentScreenOrder <= 0) {
      return "unknown-screen";
    }

    cachedMaxProgress++;
    result = "append-screen";
    progress = {
      progressIndex: cachedMaxProgress,
      areaIndex: state.currentAreaOrder,
      screenInArea: state.currentScreenOrder
    };
    cachedScreenToProgress.set(state.screen, progress);
    extendAreaRange(progress.areaIndex, progress.progressIndex);
  }

  cachedPoints.push(buildGraphPoint(state.elapsedMs, state.screen, progress));

  if (cachedPoints.length > maxPoints) {
    cachedPoints = cachedPoints.slice(-maxPoints);
  }

  lastPointKey = key;
  return result;
}

function extendAreaRange(areaIndex, progressIndex) {
  let range = cachedAreaRanges.find(item => item.areaIndex === areaIndex);

  if (!range) {
    cachedAreaRanges.push({
      areaIndex,
      start: progressIndex,
      end: progressIndex
    });
    return;
  }

  range.start = Math.min(range.start, progressIndex);
  range.end = Math.max(range.end, progressIndex);
}

function progressToY(progress, yMin, yMax, paddingTop, plotHeight) {
  return paddingTop + plotHeight - ((progress - yMin) / (yMax - yMin)) * plotHeight;
}

function drawAreaBands(ctx, yMin, yMax, paddingLeft, paddingTop, plotWidth, plotHeight) {
  cachedAreaRanges.forEach((range, index) => {
    const start = Math.max(yMin, range.start - 0.5);
    const end = Math.min(yMax, range.end + 0.5);

    if (end <= start) {
      return;
    }

    const yTop = progressToY(end, yMin, yMax, paddingTop, plotHeight);
    const yBottom = progressToY(start, yMin, yMax, paddingTop, plotHeight);
    ctx.fillStyle = index % 2 === 0
      ? "rgba(255,255,255,0.035)"
      : "rgba(255,255,255,0.015)";
    ctx.fillRect(paddingLeft, yTop, plotWidth, yBottom - yTop);
  });
}

function formatRelativeTime(milliseconds) {
  const totalSeconds = Math.max(0, Math.round(milliseconds / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;

  if (minutes <= 0) {
    return "-" + seconds + "s";
  }

  return "-" + minutes + "m";
}

function drawChart(points) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  const width = canvas.width;
  const height = canvas.height;

  ctx.clearRect(0, 0, width, height);

  const paddingLeft = 56;
  const paddingRight = 16;
  const paddingTop = 16;
  const paddingBottom = 34;

  const plotWidth = width - paddingLeft - paddingRight;
  const plotHeight = height - paddingTop - paddingBottom;

  ctx.font = "16px Cascadia Mono, Consolas, monospace";
  ctx.fillStyle = "white";
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1;

  ctx.strokeRect(paddingLeft, paddingTop, plotWidth, plotHeight);

  if (points.length === 0) {
    ctx.fillText("No screen metrics data", paddingLeft + 20, paddingTop + 40);
    return;
  }

  const visible = points.slice(-maxPoints);

  const yMin = 1;
  const yMax = Math.max(2, cachedMaxProgress);

  const minX = visible[0].elapsedMs;
  const maxX = visible[visible.length - 1].elapsedMs;

  if (maxX <= minX || yMax <= yMin) {
    return;
  }

  drawAreaBands(ctx, yMin, yMax, paddingLeft, paddingTop, plotWidth, plotHeight);

  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1;
  ctx.strokeRect(paddingLeft, paddingTop, plotWidth, plotHeight);

  const yTicks = [];
  [0, 0.25, 0.50, 0.75, 1].forEach(ratio => {
    const tick = Math.round(yMin + (yMax - yMin) * ratio);

    if (!yTicks.includes(tick)) {
      yTicks.push(tick);
    }
  });

  for (const tick of yTicks) {
    const y = progressToY(tick, yMin, yMax, paddingTop, plotHeight);

    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.moveTo(paddingLeft, y);
    ctx.lineTo(paddingLeft + plotWidth, y);
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.fillText(String(tick).padStart(3, " "), 8, y + 5);
  }

  const xTicks = [
    { ratio: 0, label: formatRelativeTime(maxX - minX) },
    { ratio: 0.5, label: formatRelativeTime((maxX - minX) / 2) },
    { ratio: 1, label: "now" }
  ];

  ctx.font = "18px Cascadia Mono, Consolas, monospace";
  ctx.fillStyle = "rgba(255,255,255,0.85)";

  xTicks.forEach(tick => {
    const x = paddingLeft + plotWidth * tick.ratio;
    const align = tick.ratio === 0 ? "left" : tick.ratio === 1 ? "right" : "center";

    ctx.textAlign = align;
    ctx.fillText(tick.label, x, paddingTop + plotHeight + 18);
  });

  ctx.textAlign = "left";

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.beginPath();

  for (let i = 0; i < visible.length; i++) {
    const p = visible[i];

    const x = paddingLeft + ((p.elapsedMs - minX) / (maxX - minX)) * plotWidth;
    const y = progressToY(p.progressIndex, yMin, yMax, paddingTop, plotHeight);

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }

  ctx.stroke();

  const last = visible[visible.length - 1];
  const lastX = paddingLeft + ((last.elapsedMs - minX) / (maxX - minX)) * plotWidth;
  const lastY = progressToY(last.progressIndex, yMin, yMax, paddingTop, plotHeight);

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "18px Cascadia Mono, Consolas, monospace";
  ctx.fillStyle = "white";
}

async function update() {
  let state = null;

  try {
    state = await loadCurrentState();

    const needsMetricReload =
      !hasFullRebuild ||
      state.attempt !== lastAttempt;

    const needsScreenRemap =
      hasFullRebuild &&
      state.attempt === lastAttempt &&
      state.screenOrderRevision !== lastScreenOrderRevision;

    if (needsMetricReload) {
      resetGraphCache();
      await loadScreenMetrics();
      hasFullRebuild = true;
      lastAttempt = state.attempt;
      lastScreenOrderRevision = state.screenOrderRevision;
    } else if (needsScreenRemap) {
      await loadScreenToProgressMap();
      remapCachedPoints();
      lastScreenOrderRevision = state.screenOrderRevision;
      lastPointKey = "";
    }

    appendStatePoint(state);
    drawChart(cachedPoints);
  } catch (e) {
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = "18px Cascadia Mono, Consolas, monospace";
    ctx.fillStyle = "white";
    ctx.fillText("Failed to load progress data", 20, 40);
  }
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
