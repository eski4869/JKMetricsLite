<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
    }

    #panel {
      display: inline-block;
      padding: 12px;
      background: rgba(0, 0, 0, 0.75);
    }

    canvas {
      display: block;
      width: 740px;
      height: 360px;
    }

    #elapsed {
      box-sizing: border-box;
      width: 740px;
      padding-right: 16px;
      margin-bottom: 4px;
      font-size: 18px;
      text-align: right;
    }
  </style>
</head>
<body>
<div id="panel">
  <div id="elapsed">0h  0m  0s 000ms</div>
  <canvas id="chart" width="740" height="360"></canvas>
</div>

<script>
const timelineFilePath = "../raw_data/screen_timeline.tsv";
const areaFilePath = "../raw_data/area_metrics.tsv";
const screenOrderFilePath = "../raw_data/screen_order.tsv";
const progressFilePath = "../raw_data/current_progress.tsv";

const maxPoints = 1500;
let cachedAreaText = "";
let cachedScreenOrderText = "";
let cachedScreenToProgress = new Map();
let cachedMaxProgress = 0;

function parseTsv(text) {
  const lines = text.trim().split(/\r?\n/);

  if (lines.length <= 1) {
    return [];
  }

  const header = lines[0].split("\t");

  return lines.slice(1).filter(line => line.trim() !== "").map(line => {
    const cols = line.split("\t");
    const row = {};

    header.forEach((key, index) => {
      row[key] = cols[index] || "";
    });

    return row;
  });
}

function getRecentLines(text, maxLines) {
  let end = text.length;

  while (end > 0) {
    const code = text.charCodeAt(end - 1);

    if (code === 10 || code === 13) {
      end--;
    } else {
      break;
    }
  }

  let start = end;
  let lines = 0;

  while (start > 0 && lines < maxLines) {
    start = text.lastIndexOf("\n", start - 1);

    if (start < 0) {
      start = 0;
      break;
    }

    lines++;
  }

  if (start > 0) {
    start++;
  }

  return text.slice(start, end).split(/\r?\n/).filter(line => line !== "");
}

async function updateStatus() {
  try {
    const res = await fetch(progressFilePath + "?t=" + Date.now());
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);

    if (lines.length <= 1) {
      document.getElementById("elapsed").textContent = "0h  0m  0s 000ms";
      return;
    }

    const header = lines[0].split("\t");
    const cols = lines[1].split("\t");
    const row = {};

    header.forEach((key, index) => {
      row[key] = cols[index] || "";
    });

    document.getElementById("elapsed").textContent = formatElapsedTime(Number(row.elapsed_ms));
  } catch (e) {
    document.getElementById("elapsed").textContent = "0h  0m  0s 000ms";
  }
}

async function loadTimeline() {
  const screenToProgress = await loadScreenToProgressMap();
  const res = await fetch(timelineFilePath + "?t=" + Date.now());
  const text = await res.text();
  const recentLines = getRecentLines(text, maxPoints);

  return recentLines.map(line => {
    const tabIndex = line.indexOf("\t");

    if (tabIndex <= 0) {
      return null;
    }

    const elapsedMs = Number(line.slice(0, tabIndex));
    const progress = screenToProgress.get(Number(line.slice(tabIndex + 1)));

    if (!progress) {
      return null;
    }

    return {
      elapsedMs,
      progressIndex: progress.progressIndex,
      areaIndex: progress.areaIndex,
      screenInArea: progress.screenInArea,
      label: progress.areaIndex + "-" + progress.screenInArea
    };
  }).filter(p =>
    p &&
    Number.isFinite(p.elapsedMs) &&
    Number.isFinite(p.progressIndex)
  );
}

async function loadScreenToProgressMap() {
  const areaRes = await fetch(areaFilePath + "?t=" + Date.now());
  const screenOrderRes = await fetch(screenOrderFilePath + "?t=" + Date.now());
  const areaText = await areaRes.text();
  const screenOrderText = await screenOrderRes.text();

  if (areaText === cachedAreaText && screenOrderText === cachedScreenOrderText) {
    return cachedScreenToProgress;
  }

  const areaRows = parseTsv(areaText);
  const screenOrderRows = parseTsv(screenOrderText);
  const includedAreas = [];
  const includedAreaSet = new Set();

  areaRows.forEach(row => {
    const areaName = row.area_name || "";

    if (areaName === "" || areaName === "Unknown" || row.is_excluded === "1") {
      return;
    }

    if (!includedAreaSet.has(areaName)) {
      includedAreaSet.add(areaName);
      includedAreas.push(areaName);
    }
  });

  const screensByArea = new Map();

  screenOrderRows.forEach(row => {
    const areaName = row.area_name || "";
    const screen = Number(row.screen);

    if (!includedAreaSet.has(areaName) || !Number.isFinite(screen)) {
      return;
    }

    if (!screensByArea.has(areaName)) {
      screensByArea.set(areaName, []);
    }

    const screens = screensByArea.get(areaName);

    if (!screens.includes(screen)) {
      screens.push(screen);
    }
  });

  const screenToProgress = new Map();
  let progressIndex = 1;

  includedAreas.forEach((areaName, areaIndex) => {
    const screens = screensByArea.get(areaName) || [];

    screens.forEach((screen, screenIndex) => {
      if (!screenToProgress.has(screen)) {
        screenToProgress.set(screen, {
          progressIndex,
          areaIndex: areaIndex + 1,
          screenInArea: screenIndex + 1
        });

        progressIndex++;
      }
    });
  });

  cachedAreaText = areaText;
  cachedScreenOrderText = screenOrderText;
  cachedScreenToProgress = screenToProgress;
  cachedMaxProgress = Math.max(0, progressIndex - 1);

  return cachedScreenToProgress;
}

function formatElapsedTime(milliseconds) {
  const totalSeconds = Math.floor(Math.max(0, milliseconds) / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor(totalSeconds / 60) % 60;
  const seconds = totalSeconds % 60;
  const ms = Math.floor(Math.max(0, milliseconds) % 1000);

  return String(hours).padStart(2, " ") + "h " +
    String(minutes).padStart(2, " ") + "m " +
    String(seconds).padStart(2, " ") + "s " +
    String(ms).padStart(3, "0") + "ms";
}

function formatRelativeTime(milliseconds) {
  const totalSeconds = Math.max(0, Math.round(milliseconds / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;

  if (minutes <= 0) {
    return "-" + seconds + "s";
  }

  return "-" + minutes + "m";
}

function drawChart(points) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  const width = canvas.width;
  const height = canvas.height;

  ctx.clearRect(0, 0, width, height);

  const paddingLeft = 56;
  const paddingRight = 16;
  const paddingTop = 16;
  const paddingBottom = 34;

  const plotWidth = width - paddingLeft - paddingRight;
  const plotHeight = height - paddingTop - paddingBottom;

  ctx.font = "16px Cascadia Mono, Consolas, monospace";
  ctx.fillStyle = "white";
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1;

  ctx.strokeRect(paddingLeft, paddingTop, plotWidth, plotHeight);

  if (points.length === 0) {
    ctx.fillText("No timeline data", paddingLeft + 20, paddingTop + 40);
    return;
  }

  const visible = points.slice(-maxPoints);

  const yMin = 1;
  const yMax = Math.max(2, cachedMaxProgress);

  const minX = visible[0].elapsedMs;
  const maxX = visible[visible.length - 1].elapsedMs;

  if (maxX <= minX || yMax <= yMin) {
    return;
  }

  const yTicks = [];
  [0, 0.25, 0.50, 0.75, 1].forEach(ratio => {
    const tick = Math.round(yMin + (yMax - yMin) * ratio);

    if (!yTicks.includes(tick)) {
      yTicks.push(tick);
    }
  });

  for (const tick of yTicks) {
    const y = paddingTop + plotHeight - ((tick - yMin) / (yMax - yMin)) * plotHeight;

    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.moveTo(paddingLeft, y);
    ctx.lineTo(paddingLeft + plotWidth, y);
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.fillText(String(tick).padStart(3, " "), 8, y + 5);
  }

  const xTicks = [
    { ratio: 0, label: formatRelativeTime(maxX - minX) },
    { ratio: 0.5, label: formatRelativeTime((maxX - minX) / 2) },
    { ratio: 1, label: "now" }
  ];

  ctx.font = "18px Cascadia Mono, Consolas, monospace";
  ctx.fillStyle = "rgba(255,255,255,0.85)";

  xTicks.forEach(tick => {
    const x = paddingLeft + plotWidth * tick.ratio;
    const align = tick.ratio === 0 ? "left" : tick.ratio === 1 ? "right" : "center";

    ctx.textAlign = align;
    ctx.fillText(tick.label, x, paddingTop + plotHeight + 18);
  });

  ctx.textAlign = "left";

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.beginPath();

  for (let i = 0; i < visible.length; i++) {
    const p = visible[i];

    const x = paddingLeft + ((p.elapsedMs - minX) / (maxX - minX)) * plotWidth;
    const y = paddingTop + plotHeight - ((p.progressIndex - yMin) / (yMax - yMin)) * plotHeight;

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }

  ctx.stroke();

  const last = visible[visible.length - 1];
  const lastX = paddingLeft + ((last.elapsedMs - minX) / (maxX - minX)) * plotWidth;
  const lastY = paddingTop + plotHeight - ((last.progressIndex - yMin) / (yMax - yMin)) * plotHeight;

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "18px Cascadia Mono, Consolas, monospace";
  ctx.fillStyle = "white";
}

async function update() {
  await updateStatus();

  try {
    const points = await loadTimeline();
    drawChart(points);
  } catch (e) {
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = "18px Cascadia Mono, Consolas, monospace";
    ctx.fillStyle = "white";
    ctx.fillText("Failed to load screen_timeline.tsv", 20, 40);
  }
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
