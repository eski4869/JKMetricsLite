<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.35;
    }

    #progress {
      display: inline-block;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
      font-size: 34px;
      line-height: 1.1;
      font-weight: bold;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 4ch auto;
      column-gap: 1ch;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
    }

    th, td {
      padding: 3px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    th.area,
    td.area {
      width: 23ch;
      max-width: 23ch;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th.time {
      width: 13ch;
      white-space: pre;
      text-align: center;
    }

    td.time {
      width: 13ch;
      white-space: pre;
      text-align: right;
    }

    th.graph,
    td.graph {
      width: 180px;
      min-width: 180px;
    }

    td.graph {
      vertical-align: middle;
    }

    .duration-track {
      width: 100%;
      height: 10px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
    }

    .duration-fill {
      height: 100%;
      background: rgba(255, 255, 255, 0.72);
    }

    .current .duration-fill {
      background: #fff;
    }

    .current td {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-weight: bold;
    }

  </style>
</head>
<body>
<div id="progress">
  <div class="progress-row"><span>PB:</span><span id="pb-value">-</span></div>
  <div class="progress-row"><span>Now:</span><span id="current-value">-</span></div>
</div>
<br>
<table>
  <thead>
    <tr>
      <th class="area">Area</th>
      <th class="time">Split</th>
      <th class="graph">Duration</th>
      <th class="time"></th>
    </tr>
  </thead>
  <tbody id="rows">
  </tbody>
</table>

<script>
const areaFilePath = "../raw_data/attempts/current/area_progress.tsv";
const stateFilePath = "../raw_data/attempts/current/current_state.tsv";
function escapeHtml(value) {
  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function getDurationPercent(durationMs, maxDurationMs) {
  if (!Number.isFinite(maxDurationMs) || !Number.isFinite(durationMs) ||
      maxDurationMs <= 0 || durationMs <= 0) {
    return 0;
  }

  return Math.max(1, Math.min(100, durationMs * 100 / maxDurationMs));
}

function parseRows(text) {
  const lines = text.trim().split(/\r?\n/);

  if (lines.length <= 1) {
    return [];
  }

  const header = lines.shift().split("\t");

  return lines.map(line => {
    const cols = line.split("\t");
    const row = {};

    header.forEach((key, index) => {
      row[key] = cols[index] || "";
    });

    return row;
  });
}

function formatProgress(areaIndex, screenInArea) {
  return areaIndex > 0 && screenInArea > 0
    ? areaIndex + "-" + screenInArea
    : "-";
}

function formatTime(milliseconds) {
  if (!Number.isFinite(milliseconds) || milliseconds < 0) {
    return "-";
  }

  const totalSeconds = Math.floor(milliseconds / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor(totalSeconds / 60) % 60;
  const seconds = totalSeconds % 60;

  return String(hours).padStart(2, " ") + "h " +
    String(minutes).padStart(2, " ") + "m " +
    String(seconds).padStart(2, " ") + "s";
}

function formatSplitTime(milliseconds) {
  return Number.isFinite(milliseconds) && milliseconds >= 0
    ? formatTime(milliseconds)
    : "?";
}

async function updateProgress() {
  try {
    const res = await fetch(stateFilePath + "?t=" + Date.now());
    const text = await res.text();
    const row = parseRows(text)[0] || {};
    const current = formatProgress(
      Number(row.current_area_order),
      Number(row.current_screen_order)
    );
    const pb = formatProgress(
      Number(row.pb_area_order),
      Number(row.pb_screen_order)
    );

    document.getElementById("current-value").textContent = current;
    document.getElementById("pb-value").textContent = pb;
  } catch (e) {
    document.getElementById("current-value").textContent = "-";
    document.getElementById("pb-value").textContent = "-";
  }
}

async function updateAreaTable() {
  try {
    const res = await fetch(areaFilePath + "?t=" + Date.now());
    const text = await res.text();

    const tbody = document.getElementById("rows");
    const data = parseRows(text);

    if (data.length === 0) {
      tbody.innerHTML = "";
      return;
    }

    const rows = data.filter(row => row.is_excluded !== "1" && row.landing_based_split_ms !== "").map(row => {
      return {
        splitMs: Number(row.landing_based_split_ms),
        areaName: row.is_unlocked === "0" ? "???" : row.area_name || "",
        durationMs: row.duration_ms === "" ? Number.NaN : Number(row.duration_ms) || 0,
        isCurrent: row.is_current === "1"
      };
    });

    const maxDurationMs = rows.reduce((max, row) => {
      return Math.max(max, Number.isFinite(row.durationMs) ? row.durationMs : 0);
    }, 0);

    const html = rows.map(row => {
      const durationPercent = getDurationPercent(row.durationMs, maxDurationMs);

      return "<tr" + (row.isCurrent ? " class='current'" : "") + ">" +
        "<td class='area'>" + escapeHtml(row.areaName) + "</td>" +
        "<td class='time'>" + escapeHtml(formatSplitTime(row.splitMs)) + "</td>" +
        "<td class='graph'><div class='duration-track'>" +
          "<div class='duration-fill' style='width:" + durationPercent.toFixed(2) + "%'></div>" +
        "</div></td>" +
        "<td class='time'>" + escapeHtml(formatTime(row.durationMs)) + "</td>" +
      "</tr>";
    }).join("");

    tbody.innerHTML = html;
  } catch (e) {
    document.getElementById("rows").innerHTML =
      "<tr><td colspan='4'>Failed to load area_progress.tsv</td></tr>";
  }
}

async function update() {
  await updateProgress();
  await updateAreaTable();
}

update();
setInterval(update, 500);
</script>
</body>
</html>
