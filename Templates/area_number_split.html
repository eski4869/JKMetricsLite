<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.35;
    }

    #progress {
      display: inline-block;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
      font-size: 34px;
      line-height: 1.1;
      font-weight: bold;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
    }

    th, td {
      padding: 3px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    }

    th.area,
    td.area {
      width: 8ch;
      max-width: 8ch;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th.time,
    td.time {
      width: 12ch;
      white-space: pre;
    }

    th.graph,
    td.graph {
      width: 180px;
      min-width: 180px;
    }

    td.graph {
      vertical-align: middle;
    }

    .duration-track {
      width: 100%;
      height: 10px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
    }

    .duration-fill {
      height: 100%;
      background: rgba(255, 255, 255, 0.72);
    }

    .current .duration-fill {
      background: #fff;
    }

    .current td {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-weight: bold;
    }

  </style>
</head>
<body>
<div id="progress">
  <div id="pb">PB: -</div>
  <div id="current">Now: -</div>
</div>
<br>
<table>
  <thead>
    <tr>
      <th class="area">Area No.</th>
      <th class="time">Split Time</th>
      <th class="graph">Duration Bar</th>
      <th class="time">Duration</th>
    </tr>
  </thead>
  <tbody id="rows">
  </tbody>
</table>

<script>
const areaFilePath = "../raw_data/area_metrics.tsv";
const progressFilePath = "../raw_data/current_progress.tsv";
function escapeHtml(value) {
  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function getDurationPercent(durationMs, maxDurationMs) {
  if (maxDurationMs <= 0 || durationMs <= 0) {
    return 0;
  }

  return Math.max(1, Math.min(100, durationMs * 100 / maxDurationMs));
}

function parseRows(text) {
  const lines = text.trim().split(/\r?\n/);

  if (lines.length <= 1) {
    return [];
  }

  const header = lines.shift().split("\t");

  return lines.map(line => {
    const cols = line.split("\t");
    const row = {};

    header.forEach((key, index) => {
      row[key] = cols[index] || "";
    });

    return row;
  });
}

function formatProgress(areaIndex, screenInArea) {
  return areaIndex > 0 && screenInArea > 0
    ? areaIndex + "-" + screenInArea
    : "-";
}

function formatTime(milliseconds) {
  if (!Number.isFinite(milliseconds) || milliseconds < 0) {
    return "-";
  }

  const totalSeconds = Math.floor(milliseconds / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor(totalSeconds / 60) % 60;
  const seconds = totalSeconds % 60;

  return String(hours).padStart(2, " ") + "h " +
    String(minutes).padStart(2, " ") + "m " +
    String(seconds).padStart(2, " ") + "s";
}

async function updateProgress() {
  try {
    const res = await fetch(progressFilePath + "?t=" + Date.now());
    const text = await res.text();
    const row = parseRows(text)[0] || {};
    const current = formatProgress(
      Number(row.current_area_index),
      Number(row.current_screen_in_area)
    );
    const pb = formatProgress(
      Number(row.pb_area_index),
      Number(row.pb_screen_in_area)
    );

    document.getElementById("current").textContent = "Now: " + current;
    document.getElementById("pb").textContent = "PB: " + pb;
  } catch (e) {
    document.getElementById("current").textContent = "Now: -";
    document.getElementById("pb").textContent = "PB: -";
  }
}

async function updateAreaTable() {
  try {
    const res = await fetch(areaFilePath + "?t=" + Date.now());
    const text = await res.text();

    const tbody = document.getElementById("rows");
    const data = parseRows(text);

    if (data.length === 0) {
      tbody.innerHTML = "";
      return;
    }

    const rows = data.filter(row => row.is_excluded !== "1").map((row, index) => {
      return {
        areaIndex: index + 1,
        splitTimeMs: row.split_time_ms === "" ? Number.NaN : Number(row.split_time_ms),
        durationMs: Number(row.duration_ms) || 0,
        isCurrent: row.is_current === "1"
      };
    });

    const maxDurationMs = rows.reduce((max, row) => Math.max(max, row.durationMs), 0);

    const html = rows.map(row => {
      const durationPercent = getDurationPercent(row.durationMs, maxDurationMs);
      const areaText = "Area " + row.areaIndex;

      return "<tr" + (row.isCurrent ? " class='current'" : "") + ">" +
        "<td class='area'>" + escapeHtml(areaText) + "</td>" +
        "<td class='time'>" + escapeHtml(formatTime(row.splitTimeMs)) + "</td>" +
        "<td class='graph'><div class='duration-track'>" +
          "<div class='duration-fill' style='width:" + durationPercent.toFixed(2) + "%'></div>" +
        "</div></td>" +
        "<td class='time'>" + escapeHtml(formatTime(row.durationMs)) + "</td>" +
      "</tr>";
    }).join("");

    tbody.innerHTML = html;
  } catch (e) {
    document.getElementById("rows").innerHTML =
      "<tr><td colspan='4'>Failed to load area_metrics.tsv</td></tr>";
  }
}

async function update() {
  await updateProgress();
  await updateAreaTable();
}

update();
setInterval(update, 500);
</script>
</body>
</html>
