<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: #fff;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.35;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
    }

    th,
    td {
      padding: 3px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    th.area,
    td.area {
      width: 24ch;
      max-width: 24ch;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th.time,
    td.time {
      width: 13ch;
      white-space: pre;
      text-align: right;
    }

    tr.summary-start td {
      padding-top: 10px;
    }

    td.label {
      color: rgba(255, 255, 255, 0.85);
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th class="area">Area Name</th>
      <th class="time">Clear Time</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const filePath = "../raw_data/ten_times_metrics.tsv";
const refreshMs = 1000;

async function fetchText(path) {
  const res = await fetch(path + "?t=" + Date.now());
  return await res.text();
}

function parseTsv(text) {
  const lines = text.trim().split(/\r?\n/);

  if (lines.length <= 1) {
    return [];
  }

  const header = lines[0].split("\t");
  const mapIndex = header.indexOf("map_name");
  const timeIndex = header.indexOf("clear_time_ms");

  if (mapIndex < 0 || timeIndex < 0) {
    return [];
  }

  const records = [];

  for (let i = 1; i < lines.length; i++) {
    if (lines[i].trim() === "") {
      continue;
    }

    const columns = lines[i].split("\t");
    const clearTime = Number(columns[timeIndex]);

    if (!Number.isFinite(clearTime)) {
      continue;
    }

    records.push({
      areaName: columns[mapIndex] || "-",
      clearTime
    });
  }

  return records;
}

function formatTime(ms) {
  if (!Number.isFinite(ms) || ms < 0) {
    return "-";
  }

  const rounded = Math.round(ms);
  const minutes = Math.floor(rounded / 60000);
  const seconds = Math.floor((rounded % 60000) / 1000);
  const milliseconds = rounded % 1000;

  return String(minutes).padStart(2, " ") + "m " +
    String(seconds).padStart(2, "0") + "s " +
    String(milliseconds).padStart(3, "0") + "ms";
}

function appendRow(tbody, areaName, clearTime, className) {
  const tr = document.createElement("tr");

  if (className) {
    tr.className = className;
  }

  const areaTd = document.createElement("td");
  areaTd.className = "area";
  areaTd.textContent = areaName;

  const timeTd = document.createElement("td");
  timeTd.className = "time";
  timeTd.textContent = formatTime(clearTime);

  tr.appendChild(areaTd);
  tr.appendChild(timeTd);
  tbody.appendChild(tr);
}

function appendSummaryRow(tbody, label, clearTime, className) {
  const tr = document.createElement("tr");

  if (className) {
    tr.className = className;
  }

  const labelTd = document.createElement("td");
  labelTd.className = "label";
  labelTd.textContent = label;

  const timeTd = document.createElement("td");
  timeTd.className = "time";
  timeTd.textContent = formatTime(clearTime);

  tr.appendChild(labelTd);
  tr.appendChild(timeTd);
  tbody.appendChild(tr);
}

function render(records) {
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";

  if (records.length === 0) {
    return;
  }

  for (const record of records) {
    appendRow(tbody, record.areaName, record.clearTime, "");
  }

  const times = records.map(record => record.clearTime);
  const total = times.reduce((sum, value) => sum + value, 0);
  const avg = total / records.length;
  const min = Math.min(...times);
  const max = Math.max(...times);

  appendSummaryRow(tbody, "avg", avg, "summary-start");
  appendSummaryRow(tbody, "min", min, "");
  appendSummaryRow(tbody, "max", max, "");
  appendSummaryRow(tbody, "total", total, "");
}

async function update() {
  try {
    render(parseTsv(await fetchText(filePath)));
  } catch {
    render([]);
  }
}

update();
setInterval(update, refreshMs);
</script>
</body>
</html>
