<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JK Metrics Lite Recap</title>
  <style>
    :root {
      --bg: #101216;
      --panel: #1a1d23;
      --line: #333943;
      --text: #f5f0df;
      --muted: #a5acb7;
      --empty: #282d35;
      --low: #245d57;
      --mid: #438f6e;
      --high: #c99a35;
      --max: #f1d27c;
      --accent: #7ab7cf;
      --monthly-jumps: var(--mid);
      --monthly-falls: #c45a50;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Meiryo", sans-serif;
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.1;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .sub,
    .label,
    .value {
      color: var(--muted);
    }

    .label {
      font-size: 13px;
    }

    .status-loading,
    .status-error {
      color: #e74c3c;
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .control-status {
      text-align: right;
      font-size: 13px;
    }

    input[type="file"] {
      max-width: 300px;
      color: var(--muted);
    }

    button {
      min-width: 40px;
      height: 34px;
      border: 1px solid var(--line);
      background: #242932;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      border-color: var(--accent);
    }

    #reloadFile {
      min-width: 34px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    #yearLabel {
      min-width: 76px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 10px;
    }

    .metric strong {
      display: block;
      color: var(--text);
      font-size: 20px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .metric-sub {
      display: block;
      color: var(--muted);
      font-size: 15px;
      margin-top: 2px;
    }

    section {
      padding: 14px;
      margin-bottom: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .hourly {
      display: grid;
      grid-template-columns: 46px repeat(24, minmax(22px, 1fr));
      gap: 5px;
      align-items: center;
    }

    .hour-label,
    .weekday-label {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .weekday-label {
      text-align: right;
      padding-right: 4px;
    }

    .hour-cell,
    .swatch {
      background: var(--empty);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .hour-cell {
      width: 100%;
      min-width: 22px;
      height: 22px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .swatch {
      width: 14px;
      height: 14px;
    }

    .swatch.level-0 {
      background: var(--empty);
    }

    .swatch.level-1 {
      background: var(--low);
    }

    .swatch.level-2 {
      background: var(--mid);
    }

    .swatch.level-3 {
      background: var(--high);
    }

    .swatch.level-4 {
      background: var(--max);
    }

    .monthly-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: -4px 0 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .monthly-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .monthly-swatch {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .monthly-swatch.jumps {
      background: var(--monthly-jumps);
    }

    .monthly-swatch.falls {
      background: var(--monthly-falls);
    }


    .monthly {
      display: grid;
      gap: 8px;
    }

    .month-row {
      display: grid;
      grid-template-columns: 38px 1fr 480px;
      gap: 10px;
      align-items: center;
    }

    .month-header {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .month-label {
      font-size: 14px;
    }

    .bar-track {
      position: relative;
      height: 20px;
      background: var(--empty);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .activity-bar {
      display: flex;
      height: 100%;
    }

    .bar {
      height: 100%;
      background: var(--monthly-jumps);
    }

    .fall-bar {
      height: 100%;
      background: var(--monthly-falls);
    }

    .value {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .value-item {
      text-align: right;
    }

    .value-number {
      font-size: 13px;
      font-weight: 600;
    }

    .empty-note {
      color: var(--muted);
      padding: 20px 0 6px;
    }

    @media (max-width: 920px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        align-items: flex-start;
        justify-content: flex-start;
      }

      .control-row {
        justify-content: flex-start;
      }

      .control-status {
        text-align: left;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      h1 {
        font-size: 36px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }

      .hourly {
        grid-template-columns: 42px repeat(24, 22px);
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1 id="recapTitle">Jump King Recap</h1>
    </div>
    <div class="controls">
      <div class="control-row">
        <button id="openFile" title="Choose total_stats.tsv">Choose TSV File</button>
        <input id="fileInput" type="file" accept=".tsv,text/tab-separated-values,text/plain" hidden>
        <button id="reloadFile" title="Reload selected TSV" aria-label="Reload selected TSV" disabled>&#x21bb;</button>
        <button id="prevYear" title="Previous year">&lt;</button>
        <div id="yearLabel">----</div>
        <button id="nextYear" title="Next year">&gt;</button>
      </div>
      <div id="status" class="sub control-status status-loading">Choose total_stats.tsv to render your metrics.</div>
    </div>
  </header>

  <div class="summary">
    <div class="metric"><span class="label">Total jumps</span><strong id="totalJumps">-</strong></div>
    <div class="metric"><span class="label">Total falls</span><strong id="totalFalls">-</strong></div>
    <div class="metric"><span class="label">Falls / jumps</span><strong id="fallRate">-</strong></div>
    <div class="metric"><span class="label">Play time</span><strong id="playTime">-</strong></div>
    <div class="metric"><span class="label">Idle time</span><strong id="idleTime">-</strong></div>
    <div class="metric"><span class="label">Active days</span><strong id="activeDays">-</strong></div>
    <div class="metric"><span class="label">Longest streak</span><strong id="longestStreak">-</strong></div>
    <div class="metric"><span class="label">Current streak</span><strong id="currentStreak">-</strong></div>
    <div class="metric"><span class="label">Best day</span><strong id="bestDay">-</strong></div>
    <div class="metric"><span class="label">Best month</span><strong id="bestMonth">-</strong></div>
    <div class="metric"><span class="label">Best weekday</span><strong id="bestWeekday">-</strong></div>
    <div class="metric"><span class="label">Best hour</span><strong id="bestHour">-</strong></div>
  </div>

  <section>
    <h2>Weekly Activity</h2>
    <div id="hourly" class="hourly"></div>
    <div class="legend">Less <span class="swatch level-0"></span><span class="swatch level-1"></span><span class="swatch level-2"></span><span class="swatch level-3"></span><span class="swatch level-4"></span> More</div>
  </section>

  <section>
    <h2>Monthly Activity</h2>
    <div class="monthly-legend"><span><span class="monthly-swatch jumps"></span>Jumps</span><span><span class="monthly-swatch falls"></span>Falls</span></div>
    <div id="monthly" class="monthly"></div>
  </section>
</div>

<script>
const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const colors = ["var(--empty)", "var(--low)", "var(--mid)", "var(--high)", "var(--max)"];

let samples = [];
let selectedYear = null;
let selectedFile = null;
let selectedFileHandle = null;

function parseTsv(text) {
  const lines = text.trim().split(/\r?\n/);

  if (lines.length <= 1) {
    return [];
  }

  const header = lines.shift().split("\t").map(key => key.trim().replace(/^\uFEFF/, ""));

  return lines.map(line => {
    const cols = line.split("\t");
    const row = {};

    header.forEach((key, index) => {
      row[key] = (cols[index] || "").trim();
    });

    const sampledAt = row.sampled_at;
    const date = new Date(sampledAt);

    return {
      sampledAt,
      date,
      totalFrames: Number(row.total_frames),
      totalJumps: Number(row.total_jumps),
      totalFalls: Number(row.total_falls)
    };
  }).filter(row =>
    row.sampledAt &&
    !Number.isNaN(row.date.getTime()) &&
    Number.isFinite(row.totalFrames) &&
    Number.isFinite(row.totalJumps) &&
    Number.isFinite(row.totalFalls)
  );
}

function buildDeltas(rows) {
  const deltas = [];

  for (let i = 1; i < rows.length; i++) {
    const prev = rows[i - 1];
    const current = rows[i];
    const frames = Math.max(0, current.totalFrames - prev.totalFrames);
    const jumps = Math.max(0, current.totalJumps - prev.totalJumps);
    const falls = Math.max(0, current.totalFalls - prev.totalFalls);

    if (frames === 0 && jumps === 0 && falls === 0) {
      continue;
    }

    deltas.push({
      year: current.date.getFullYear(),
      month: current.date.getMonth() + 1,
      weekday: current.date.getDay(),
      hour: current.date.getHours(),
      localDate: formatDateKey(current.date),
      frames,
      jumps,
      falls,
      idleFrames: frames > 0 && jumps === 0 ? frames : 0
    });
  }

  return deltas;
}

function formatDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function dateKeyToDayNumber(key) {
  const [year, month, day] = key.split("-").map(Number);

  return Math.floor(Date.UTC(year, month - 1, day) / 86400000);
}

function addToMap(map, key, frames, jumps, falls, idleFrames, activeDate) {
  if (!map.has(key)) {
    map.set(key, { frames: 0, jumps: 0, falls: 0, idleFrames: 0, activeDates: new Set() });
  }

  const item = map.get(key);
  item.frames += frames;
  item.jumps += jumps;
  item.falls += falls;
  item.idleFrames += idleFrames;

  if (activeDate && jumps > 0) {
    item.activeDates.add(activeDate);
  }
}

function calculateStreaks(activeDates) {
  const days = Array.from(activeDates)
    .map(dateKeyToDayNumber)
    .sort((a, b) => a - b);

  if (days.length === 0) {
    return { longest: 0, current: 0 };
  }

  let longest = 1;
  let current = 1;

  for (let i = 1; i < days.length; i++) {
    if (days[i] === days[i - 1] + 1) {
      current++;
    } else if (days[i] !== days[i - 1]) {
      current = 1;
    }

    longest = Math.max(longest, current);
  }

  return { longest, current };
}

function level(value, max) {
  if (value <= 0 || max <= 0) return 0;
  const ratio = value / max;
  if (ratio < 0.25) return 1;
  if (ratio < 0.50) return 2;
  if (ratio < 0.75) return 3;
  return 4;
}

function formatNumber(value) {
  return Math.round(value).toLocaleString("en-US");
}

function formatFrames(frames) {
  const seconds = Math.round(frames / 60);
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);

  return hours > 0 ? `${hours}h ${String(minutes).padStart(2, "0")}m` : `${minutes}m`;
}

function setMetric(id, primary, secondary) {
  const node = document.getElementById(id);
  node.innerHTML = secondary
    ? `${primary}<span class="metric-sub">${secondary}</span>`
    : primary;
}

function setStatus(text, tone) {
  const node = document.getElementById("status");
  node.textContent = text;
  node.className = tone ? `sub control-status status-${tone}` : "sub control-status";
}

function formatFallRate(jumps, falls) {
  return jumps > 0 ? `${((falls / jumps) * 100).toFixed(1)}%` : "-";
}

function availableYears() {
  return Array.from(new Set(samples.map(row => row.date.getFullYear()))).sort();
}

function nextFrame() {
  return new Promise(resolve => requestAnimationFrame(resolve));
}

function renderYear(year) {
  selectedYear = year;
  document.getElementById("yearLabel").textContent = year;
  document.getElementById("recapTitle").textContent = `Jump King Recap ${year}`;

  const deltas = buildDeltas(samples).filter(row => row.year === year);
  const hourlyMap = new Map();
  const monthlyMap = new Map();
  const dailyMap = new Map();
  const weekdayMap = new Map();
  const activeDates = new Set();

  for (const row of deltas) {
    addToMap(hourlyMap, `${row.weekday}-${row.hour}`, row.frames, row.jumps, row.falls, row.idleFrames, row.localDate);
    addToMap(monthlyMap, row.month, row.frames, row.jumps, row.falls, row.idleFrames);
    addToMap(dailyMap, row.localDate, row.frames, row.jumps, row.falls, row.idleFrames);
    addToMap(weekdayMap, row.weekday, row.frames, row.jumps, row.falls, row.idleFrames);

    if (row.jumps > 0) {
      activeDates.add(row.localDate);
    }
  }

  renderSummary(deltas, hourlyMap, monthlyMap, dailyMap, weekdayMap, activeDates);
  renderHourly(hourlyMap);
  renderMonthly(monthlyMap, dailyMap);
}

function renderSummary(deltas, hourlyMap, monthlyMap, dailyMap, weekdayMap, activeDates) {
  const totalJumps = deltas.reduce((sum, row) => sum + row.jumps, 0);
  const totalFalls = deltas.reduce((sum, row) => sum + row.falls, 0);
  const totalFrames = deltas.reduce((sum, row) => sum + row.frames, 0);
  const idleFrames = deltas.reduce((sum, row) => sum + row.idleFrames, 0);
  const streaks = calculateStreaks(activeDates);
  let bestHour = "-";
  let bestHourJumps = 0;
  let bestDay = "-";
  let bestDayJumps = 0;
  let bestMonth = "-";
  let bestMonthJumps = 0;
  let bestWeekday = "-";
  let bestWeekdayJumps = 0;
  const fallRate = formatFallRate(totalJumps, totalFalls);

  for (const [key, value] of hourlyMap.entries()) {
    if (value.jumps > bestHourJumps) {
      bestHourJumps = value.jumps;
      const parts = key.split("-");
      bestHour = `${weekdays[Number(parts[0])]} ${String(parts[1]).padStart(2, "0")}:00`;
    }
  }

  for (const [key, value] of dailyMap.entries()) {
    if (value.jumps > bestDayJumps) {
      bestDayJumps = value.jumps;
      bestDay = key;
    }
  }

  for (const [key, value] of monthlyMap.entries()) {
    if (value.jumps > bestMonthJumps) {
      bestMonthJumps = value.jumps;
      bestMonth = months[Number(key) - 1];
    }
  }

  for (const [key, value] of weekdayMap.entries()) {
    if (value.jumps > bestWeekdayJumps) {
      bestWeekdayJumps = value.jumps;
      bestWeekday = weekdays[Number(key)];
    }
  }

  const playTime = formatFrames(totalFrames);
  const idleTime = formatFrames(idleFrames);
  setMetric("totalJumps", formatNumber(totalJumps));
  setMetric("totalFalls", formatNumber(totalFalls));
  setMetric("fallRate", fallRate);
  setMetric("playTime", playTime);
  setMetric("idleTime", idleTime);
  setMetric("activeDays", formatNumber(activeDates.size));
  setMetric("longestStreak", `${formatNumber(streaks.longest)} days`);
  setMetric("currentStreak", `${formatNumber(streaks.current)} days`);
  setMetric("bestDay", bestDay, bestDay === "-" ? "" : `${formatNumber(bestDayJumps)} jumps`);
  setMetric("bestMonth", bestMonth, bestMonth === "-" ? "" : `${formatNumber(bestMonthJumps)} jumps`);
  setMetric("bestWeekday", bestWeekday, bestWeekday === "-" ? "" : `${formatNumber(bestWeekdayJumps)} jumps`);
  setMetric("bestHour", bestHour, bestHour === "-" ? "" : `${formatNumber(bestHourJumps)} jumps`);
}

function renderHourly(hourlyMap) {
  const root = document.getElementById("hourly");
  root.innerHTML = "";
  root.appendChild(document.createElement("div"));

  for (let hour = 0; hour < 24; hour++) {
    const label = document.createElement("div");
    label.className = "hour-label";
    label.textContent = String(hour).padStart(2, "0");
    root.appendChild(label);
  }

  const maxJumps = Math.max(0, ...Array.from(hourlyMap.values()).map(value => value.jumps));

  for (let weekday = 0; weekday < weekdays.length; weekday++) {
    const rowLabel = document.createElement("div");
    rowLabel.className = "weekday-label";
    rowLabel.textContent = weekdays[weekday];
    root.appendChild(rowLabel);

    for (let hour = 0; hour < 24; hour++) {
      const key = `${weekday}-${hour}`;
      const data = hourlyMap.get(key) || { frames: 0, jumps: 0, falls: 0, idleFrames: 0, activeDates: new Set() };
      const cell = document.createElement("div");
      const lv = level(data.jumps, maxJumps);

      cell.className = "hour-cell";
      cell.style.background = colors[lv];
      cell.title =
        `${weekdays[weekday]} ${String(hour).padStart(2, "0")}:00\n` +
        `Jumps: ${formatNumber(data.jumps)}\n` +
        `Falls: ${formatNumber(data.falls)}\n` +
        `Play time: ${formatFrames(data.frames)}\n` +
        `Idle time: ${formatFrames(data.idleFrames)}\n` +
        `Active days: ${formatNumber(data.activeDates.size)}`;
      root.appendChild(cell);
    }
  }
}

function renderMonthly(monthlyMap, dailyMap) {
  const root = document.getElementById("monthly");
  root.innerHTML = "";

  const maxJumps = Math.max(0, ...Array.from(monthlyMap.values()).map(value => value.jumps));
  const header = document.createElement("div");
  const headerLabel = document.createElement("div");
  const headerTrack = document.createElement("div");
  const headerValue = document.createElement("div");

  header.className = "month-row month-header";
  headerValue.className = "value";
  headerValue.innerHTML =
    `<span class="value-item">Jumps</span>` +
    `<span class="value-item">Falls</span>` +
    `<span class="value-item">Falls / jumps</span>` +
    `<span class="value-item">Play time</span>` +
    `<span class="value-item">Idle time</span>` +
    `<span class="value-item">Active days</span>`;
  header.appendChild(headerLabel);
  header.appendChild(headerTrack);
  header.appendChild(headerValue);
  root.appendChild(header);

  for (let month = 1; month <= 12; month++) {
    const data = monthlyMap.get(month) || { frames: 0, jumps: 0, falls: 0, idleFrames: 0 };
    let activeDays = 0;
    const row = document.createElement("div");
    const label = document.createElement("div");
    const track = document.createElement("div");
    const activityBar = document.createElement("div");
    const bar = document.createElement("div");
    const fallBar = document.createElement("div");
    const value = document.createElement("div");

    row.className = "month-row";
    label.className = "month-label";
    label.textContent = months[month - 1];
    track.className = "bar-track";
    activityBar.className = "activity-bar";
    bar.className = "bar";
    fallBar.className = "fall-bar";
    const jumpPercent = maxJumps > 0 && data.jumps > 0 ? Math.max(2, data.jumps / maxJumps * 100) : 0;
    const fallPercent = maxJumps > 0 && data.falls > 0 ? Math.min(100, data.falls * 2 / maxJumps * 100) : 0;
    const visibleFallPercent = Math.min(jumpPercent, fallPercent);
    const cleanJumpPercent = Math.max(0, jumpPercent - visibleFallPercent);
    const cleanShare = jumpPercent > 0 ? cleanJumpPercent / jumpPercent * 100 : 0;
    const fallShare = jumpPercent > 0 ? visibleFallPercent / jumpPercent * 100 : 0;

    activityBar.style.width = `${jumpPercent}%`;
    bar.style.width = `${cleanShare}%`;
    fallBar.style.width = `${fallShare}%`;
    value.className = "value";
    for (const [dateKey, day] of dailyMap.entries()) {
      if (dateKey.slice(5, 7) === String(month).padStart(2, "0") && day.jumps > 0) {
        activeDays++;
      }
    }

    row.title =
      `${months[month - 1]}\n` +
      `Jumps: ${formatNumber(data.jumps)}\n` +
      `Falls: ${formatNumber(data.falls)}\n` +
      `Falls / jumps: ${formatFallRate(data.jumps, data.falls)}\n` +
      `Play time: ${formatFrames(data.frames)}\n` +
      `Idle time: ${formatFrames(data.idleFrames)}\n` +
      `Active days: ${formatNumber(activeDays)}`;

    value.innerHTML =
      `<span class="value-item value-number">${formatNumber(data.jumps)}</span>` +
      `<span class="value-item value-number">${formatNumber(data.falls)}</span>` +
      `<span class="value-item value-number">${formatFallRate(data.jumps, data.falls)}</span>` +
      `<span class="value-item value-number">${formatFrames(data.frames)}</span>` +
      `<span class="value-item value-number">${formatFrames(data.idleFrames)}</span>` +
      `<span class="value-item value-number">${formatNumber(activeDays)}</span>`;

    activityBar.appendChild(bar);
    activityBar.appendChild(fallBar);
    track.appendChild(activityBar);
    row.appendChild(label);
    row.appendChild(track);
    row.appendChild(value);
    root.appendChild(row);
  }
}

function moveYear(offset) {
  const years = availableYears();
  const index = years.indexOf(selectedYear);

  if (index < 0) {
    return;
  }

  const nextIndex = Math.max(0, Math.min(years.length - 1, index + offset));
  renderYear(years[nextIndex]);
}

async function loadText(text, label) {
  setStatus(`${label}: loading...`, "loading");
  await nextFrame();

  samples = parseTsv(text);
  const years = availableYears();

  setStatus(`${label}: ${formatNumber(samples.length)} samples loaded`, "");

  if (years.length === 0) {
    setStatus(`${label}: no valid samples found`, "error");
    return;
  }

  renderYear(years[0]);
}

function setSelectedFile(file, handle) {
  selectedFile = file;
  selectedFileHandle = handle || null;
  document.getElementById("reloadFile").disabled = false;
  loadFile(file);
}

function loadFile(file) {
  const reader = new FileReader();
  setStatus(`${file.name}: reading...`, "loading");
  reader.onload = () => {
    loadText(String(reader.result || ""), file.name).catch(error => {
      setStatus(`${file.name}: failed to load (${error.message})`, "error");
    });
  };
  reader.readAsText(file, "utf-8");
}

async function openFile() {
  if (window.showOpenFilePicker) {
    const [handle] = await window.showOpenFilePicker({
      types: [{
        description: "TSV files",
        accept: {
          "text/tab-separated-values": [".tsv"],
          "text/plain": [".tsv", ".txt"]
        }
      }],
      excludeAcceptAllOption: false,
      multiple: false
    });

    setSelectedFile(await handle.getFile(), handle);
    return;
  }

  document.getElementById("fileInput").click();
}

async function reloadFile() {
  if (!selectedFile) {
    setStatus("Choose total_stats.tsv before reloading.", "error");
    return;
  }

  if (selectedFileHandle) {
    setSelectedFile(await selectedFileHandle.getFile(), selectedFileHandle);
    return;
  }

  setStatus("Select the TSV again to reload updated data.", "loading");
  document.getElementById("fileInput").value = "";
  document.getElementById("fileInput").click();
}

document.getElementById("openFile").addEventListener("click", () => {
  openFile().catch(error => {
    if (error.name !== "AbortError") {
      setStatus(`Failed to open TSV: ${error.message}`, "error");
    }
  });
});

document.getElementById("fileInput").addEventListener("change", event => {
  const file = event.target.files[0];

  if (!file) {
    return;
  }

  setSelectedFile(file, null);
});

document.getElementById("reloadFile").addEventListener("click", () => {
  reloadFile().catch(error => {
    if (error.name !== "AbortError") {
      setStatus(`Failed to reload TSV: ${error.message}`, "error");
    }
  });
});

document.getElementById("prevYear").addEventListener("click", () => moveYear(-1));
document.getElementById("nextYear").addEventListener("click", () => moveYear(1));
</script>
</body>
</html>
